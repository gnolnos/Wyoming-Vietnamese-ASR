name: Release & Docker Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'docker/**'
      - 'wyoming-vietnamese-asr/**'
      - 'repository.yaml'

env:
  GHCR_IMG: ghcr.io/${{ github.repository_owner }}/wyoming-vietnamese-asr
  DOCKERHUB_IMG: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/wyoming-vietnamese-asr

jobs:
  # Build multi-arch image và push đồng thời lên cả GHCR + Docker Hub.
  # `:latest` và `:v<tag>` là manifest list chung cho amd64+arm64;
  # GitHub branch push (main) chỉ build amd64 (nhanh hơn, không phá ghcr convention cũ).
  build-app:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch GHCR + Docker Hub)
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          # Push TAG → đủ 2 arch; push branch/main chỉ amd64 (không override tag release)
          platforms: >-
            ${{ startsWith(github.ref, 'refs/tags/v')
              && 'linux/amd64,linux/arm64'
              || 'linux/amd64' }}
          tags: |
            ${{ env.GHCR_IMG }}:latest
            ${{ env.GHCR_IMG }}:${{ github.ref_name }}
            ${{ env.DOCKERHUB_IMG }}:latest
            ${{ env.DOCKERHUB_IMG }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max