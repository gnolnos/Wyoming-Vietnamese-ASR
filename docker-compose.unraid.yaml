# ============================================================
#  Wyoming Vietnamese ASR — Triển khai cho Unraid
#  (Z.O.L.A "TAI" — Speech-to-Text tiếng Việt)
# ============================================================
#  Cách dùng trên Unraid:
#   1. Clone repo lên máy (hoặc đặt compose trong thư mục repo đã clone):
#        git clone https://github.com/gnolnos/Wyoming-Vietnamese-ASR.git
#        cd Wyoming-Vietnamese-ASR
#   2. Đặt file này (docker-compose.yaml) trong thư mục repo
#   3. docker compose up -d --build
#
#  ┌─────────────────────────────────────────────────────────┐
#  │ 2 service:                                          │
#  │  • wyoming-asr :10400 (giao thức Wyoming → HA/Assist) │
#  │  • fastapi-asr :8090  (HTTP POST /transcribe → Zola)  │
#  └─────────────────────────────────────────────────────────┘
#  Cả hai dùng chung thư mục ./model (auto-download lần đầu).
#
#  Ghi chú về GHCR image: image build cloud hiện là PRIVATE
#  (pull anon 404). Dùng build: local cho chắc — khớp code đã test.
#  Nếu muốn dùng image GHCR: docker login ghcr.io (tài khoản có
#  read:packages) rồi đổi `build:` → `image: ghcr.io/gnolnos/...`.

services:

  # ---- [ TAI ] Wyoming server :10400 → kết nối Home Assistant ----
  wyoming-asr:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: wyoming-vietnamese-asr:local
    container_name: wyoming-asr
    user: "root"                       # cần để ghi vào ./model (bind mount)
    network_mode: host                 # Unraid: HA reach qua localhost/lan
    environment:
      MODE: "wyoming"                  # chạy Wyoming server
      HF_MODEL_ID: "hynt/Zipformer-30M-RNNT-6000h"
      HF_TOKEN: ""
      FORCE_DOWNLOAD: "false"
      CHECK_UPDATE: "true"              # true = tự check & tải model mới mỗi lần chạy
      USE_INT8: "false"                # true = nhanh hơn, giảm nhẹ độ chính xác
      TOKENS_FILE: "config.json"
      NUM_THREADS: "4"
      PROVIDER: "cpu"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "10400"
      LOG_LEVEL: "INFO"
    volumes:
      - ./model:/app/model             # model auto-tải về lần đầu
    restart: unless-stopped

