services:

  wyoming-vietnamese-asr:
    # Build từ Dockerfile local (chứa auto-download) — không dùng image cũ thiếu auto-download
    build:
      context: .
      dockerfile: Dockerfile
    image: mkbyme/wyoming-vietnamese-asr:1.0.10
    container_name: wyoming-vietnamese-asr
    user: "root"
    ports:
      - "10400:10400"
    environment:
      MODE: "wyoming"           # ← default, có thể bỏ
      HF_MODEL_ID: "hynt/Zipformer-30M-RNNT-6000h"
      HF_TOKEN: ""
      FORCE_DOWNLOAD: "false"
      CHECK_UPDATE: "true"     # tự check & tải model mới
      USE_INT8: "false"
      TOKENS_FILE: "config.json"
      NUM_THREADS: "4"
      PROVIDER: "cpu"
      LOG_LEVEL: "INFO"
    volumes:
      - ./model:/app/model     # Model tự tải về đây khi khởi động lần đầu
    restart: unless-stopped

  wyoming-fastapi:
    # Build từ Dockerfile local (chứa auto-download) — không dùng image cũ thiếu auto-download
    build:
      context: .
      dockerfile: Dockerfile
    image: mkbyme/wyoming-vietnamese-asr:1.0.10
    container_name: wyoming-fastapi
    user: "root"
    ports:
      - "8090:8090"
    environment:
      MODE: "fastapi"           # ← switch sang FastAPI
      HF_MODEL_ID: "hynt/Zipformer-30M-RNNT-6000h"
      HF_TOKEN: ""
      FORCE_DOWNLOAD: "false"
      CHECK_UPDATE: "true"     # tự check & tải model mới
      USE_INT8: "false"
      TOKENS_FILE: "config.json"
      NUM_THREADS: "4"
      PROVIDER: "cpu"
      API_HOST: "0.0.0.0"
      API_PORT: "8090"
      LOG_LEVEL: "INFO"
    volumes:
      - ./model:/app/model     # Model tự tải khi khởi động lần đầu
    depends_on:
      - wyoming-vietnamese-asr
    restart: unless-stopped
